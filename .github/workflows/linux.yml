name: Linux

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/checkout"
          git checkout --force --detach "${GITHUB_SHA}"

      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint workflows
        run: ./actionlint

  shell-lint:
    name: Shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/checkout"
          git checkout --force --detach "${GITHUB_SHA}"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck -x \
            packaging/linux/*.sh \
            packaging/linux/wrappers/*.in

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - workflow-lint
      - shell-lint
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/checkout"
          git checkout --force --detach "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: make check PYTHON=python

  zipapp-smoke:
    name: Zipapp smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/checkout"
          git checkout --force --detach "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build zipapp
        run: make zipapp PYTHON=python

      - name: Smoke test zipapp
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          python dist/telachat.pyz --version
          python dist/telachat.pyz profiles --json > "$RUNNER_TEMP/profiles.json"
          python dist/telachat.pyz config-check --json > "$RUNNER_TEMP/config-check.json"

  install-smoke:
    name: Install smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/checkout"
          git checkout --force --detach "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install .

      - name: Smoke test installed console scripts
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          telachat --version
          telachat profiles --json > "$RUNNER_TEMP/installed-profiles.json"
          telachat config-check --json > "$RUNNER_TEMP/installed-config-check.json"

  package:
    name: Package Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - zipapp-smoke
      - install-smoke
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/checkout"
          git checkout --force --detach "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Decide periodic package cadence
        id: cadence
        run: python packaging/linux/package-cadence.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build installer script
        run: make linux-installer PYTHON=python

      - name: Smoke test installer script
        run: make linux-installer-smoke PYTHON=python

      - name: Build RPM package
        if: steps.cadence.outputs.build_periodic == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          make linux-rpm PYTHON=python
          find dist/rpm/RPMS dist/rpm/SRPMS -type f -name '*.rpm' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > dist/telachat-rpm.sha256

      - name: Build Snap package
        if: steps.cadence.outputs.build_periodic == 'true'
        continue-on-error: true
        uses: snapcore/action-build@v1

      - name: Collect Snap package
        if: steps.cadence.outputs.build_periodic == 'true'
        run: |
          mkdir -p dist/snap
          find . -maxdepth 1 -type f -name '*.snap' -print -exec mv {} dist/snap/ \;
          if find dist/snap -type f -name '*.snap' -print -quit | grep -q .; then
            find dist/snap -type f -name '*.snap' -print0 \
              | sort -z \
              | xargs -0 sha256sum > dist/telachat-snap.sha256
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: telachat-linux
          path: |
            dist/telachat-install-*.sh
            dist/rpm/RPMS/**/*.rpm
            dist/rpm/SRPMS/**/*.rpm
            dist/telachat-rpm.sha256
            dist/snap/*.snap
            dist/telachat-snap.sha256
          if-no-files-found: error

      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Automated Linux build for $tag."
          fi

          mapfile -d '' assets < <(
            find dist \
              -type f \
              \( -name 'telachat-install-*.sh' -o -name '*.rpm' -o -name '*.snap' -o -name 'telachat-rpm.sha256' -o -name 'telachat-snap.sha256' \) \
              -print0 | sort -z
          )
          if [ "${#assets[@]}" -lt 1 ]; then
            echo "No Linux release assets found." >&2
            exit 1
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
