name: Linux

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint workflows
        run: ./actionlint

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    needs: workflow-lint
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: make check PYTHON=python

  zipapp-smoke:
    name: Zipapp smoke
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build zipapp
        run: make zipapp PYTHON=python

      - name: Smoke test zipapp
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          mkdir -p "$XDG_CONFIG_HOME"
          python dist/telachat.pyz --version
          python dist/telachat.pyz profiles --json > "$RUNNER_TEMP/profiles.json"
          python dist/telachat.pyz config-check --json > "$RUNNER_TEMP/config-check.json"
