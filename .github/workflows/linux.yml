name: Linux

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: make check PYTHON=python

  zipapp-smoke:
    name: Zipapp smoke
    runs-on: ubuntu-24.04
    needs: test
    env:
      XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build zipapp
        run: make zipapp PYTHON=python

      - name: Smoke test zipapp
        run: |
          python dist/telachat.pyz --version
          python dist/telachat.pyz profiles --json > "$RUNNER_TEMP/profiles.json"
          python dist/telachat.pyz config-check --json > "$RUNNER_TEMP/config-check.json"
