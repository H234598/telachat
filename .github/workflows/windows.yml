name: Windows

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Run Windows test suite
        shell: pwsh
        run: .\packaging\windows\test-windows.ps1 -Python python

  package:
    name: Package Windows
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: .\packaging\windows\build-tk-windows.ps1 -Python python

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telachat-windows
          path: |
            dist/TelachatTk/**
            dist/TelachatTk-Setup-*.exe
            dist/TelachatTk-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Attach installer to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "${{ github.ref_name }}"
          gh release view $Tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $Tag --title $Tag --notes "Automated Windows build for $Tag."
          }
          gh release upload $Tag dist\TelachatTk-Setup-*.exe dist\TelachatTk-Setup-*.exe.sha256 --clobber
