name: Windows

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Windows
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Run Windows test suite
        shell: pwsh
        run: .\packaging\windows\test-windows.ps1 -Python python

  package:
    name: Package Windows
    runs-on: windows-2022
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Windows packages
        shell: pwsh
        run: .\packaging\windows\build-tk-windows.ps1 -Python python

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: telachat-windows
          path: |
            dist/TelachatTk/**
            dist/TelachatTk-*-windows-x64.zip
            dist/TelachatTk-*-windows-x64.zip.sha256
            dist/TelachatTk-Setup-*.exe
            dist/TelachatTk-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Attach packages to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "${{ github.ref_name }}"
          gh release view $Tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $Tag --title $Tag --notes "Automated Windows build for $Tag."
          }

          $Assets = @(
            Get-ChildItem -File dist\TelachatTk-*-windows-x64.zip,
              dist\TelachatTk-*-windows-x64.zip.sha256,
              dist\TelachatTk-Setup-*.exe,
              dist\TelachatTk-Setup-*.exe.sha256
          ) | Sort-Object FullName
          if ($Assets.Count -ne 4) {
            throw "Expected exactly 4 Windows release assets; found $($Assets.Count)."
          }

          gh release upload $Tag @($Assets.FullName) --clobber
