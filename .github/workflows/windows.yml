name: Windows

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-syntax:
    name: PowerShell syntax
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Parse PowerShell packaging scripts
        shell: pwsh
        run: |
          $Failures = @()
          Get-ChildItem -Path packaging\windows -Filter *.ps1 |
            Sort-Object FullName |
            ForEach-Object {
              $Tokens = $null
              $ParseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors) | Out-Null
              foreach ($ParseError in $ParseErrors) {
                $Failures += "$($_.FullName):$($ParseError.Extent.StartLineNumber): $($ParseError.Message)"
              }
            }

          if ($Failures.Count -gt 0) {
            $Failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

  test:
    name: Test Windows
    runs-on: windows-2022
    timeout-minutes: 30
    needs: powershell-syntax
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Run Windows test suite
        shell: pwsh
        run: .\packaging\windows\test-windows.ps1 -Python python

      - name: Smoke test NSIS installer script
        shell: pwsh
        run: |
          $DistDir = Join-Path $env:RUNNER_TEMP "nsis-dist"
          $AppDir = Join-Path $DistDir "TelachatTk"
          New-Item -ItemType Directory -Force -Path $AppDir | Out-Null
          Set-Content -Encoding ASCII -Path (Join-Path $AppDir "TelachatTk.exe") -Value "stub"

          makensis /DPRODUCT_VERSION=0.0.0 "/DDIST_DIR=$DistDir" packaging\windows\telachat-tk.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer smoke test failed with exit code $LASTEXITCODE."
          }

  package:
    name: Package Windows
    runs-on: windows-2022
    timeout-minutes: 45
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Windows packages
        shell: pwsh
        run: .\packaging\windows\build-tk-windows.ps1 -Python python

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: telachat-windows
          path: |
            dist/TelachatTk/**
            dist/TelachatTk-*-windows-x64.zip
            dist/TelachatTk-*-windows-x64.zip.sha256
            dist/TelachatTk-Setup-*.exe
            dist/TelachatTk-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Attach packages to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "${{ github.ref_name }}"
          gh release view $Tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $Tag --title $Tag --notes "Automated Windows build for $Tag."
          }

          $Assets = @(
            Get-ChildItem -File dist\TelachatTk-*-windows-x64.zip,
              dist\TelachatTk-*-windows-x64.zip.sha256,
              dist\TelachatTk-Setup-*.exe,
              dist\TelachatTk-Setup-*.exe.sha256
          ) | Sort-Object FullName
          if ($Assets.Count -ne 4) {
            throw "Expected exactly 4 Windows release assets; found $($Assets.Count)."
          }

          gh release upload $Tag @($Assets.FullName) --clobber
