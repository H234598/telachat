[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telachat"
version = "0.39.0"
description = "A small, configurable OpenAI-compatible chat client."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Teladi"}
]
dependencies = []

[project.scripts]
telachat = "telachat.cli:main"
telachat-gtk = "telachat.gtkgui:main"
telachat-tk = "telachat.tkgui:main"

[tool.setuptools.packages.find]
where = ["src"]
